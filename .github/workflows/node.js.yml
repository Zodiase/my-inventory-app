# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: App Tests
permissions:
    contents: read

env:
    METEOR_VERSION: 3.4.1

on:
    push:
        branches: ['master']
    pull_request:
        branches:
            - 'master'
            - 'twig/**'

concurrency:
    group: app-tests-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    script-tests:
        name: Script tests
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: ['22.x', '24.x']
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
                  cache-dependency-path: |
                      package-lock.json
                      meteor-app/package-lock.json
            - run: npm ci --ignore-scripts
            - run: npm ci --ignore-scripts --prefix meteor-app
            - run: npm run test:scripts

    type-check:
        name: Check types
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: ['22.x', '24.x']
        defaults:
            run:
                shell: bash -l {0}
                working-directory: meteor-app
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
                  cache-dependency-path: 'meteor-app/package-lock.json'
            - name: Cache Meteor installation
              uses: actions/cache@v6
              with:
                  path: ~/.meteor
                  key: ${{ runner.os }}-meteor-${{ env.METEOR_VERSION }}
            - name: Install Meteor ${{ env.METEOR_VERSION }}
              run: |
                  curl "https://install.meteor.com/?release=${METEOR_VERSION}" | sh
                  echo "$HOME/.meteor" >> "$GITHUB_PATH"
                  "$HOME/.meteor/meteor" --version
            - run: npm ci
            - run: meteor lint
            - run: npm run check:type

    code-style-check:
        name: Check coding styles
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: ['22.x', '24.x']
        defaults:
            run:
                shell: bash -l {0}
                working-directory: meteor-app
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
                  cache-dependency-path: 'meteor-app/package-lock.json'
            - name: Cache Meteor installation
              uses: actions/cache@v6
              with:
                  path: ~/.meteor
                  key: ${{ runner.os }}-meteor-${{ env.METEOR_VERSION }}
            - name: Install Meteor ${{ env.METEOR_VERSION }}
              run: |
                  curl "https://install.meteor.com/?release=${METEOR_VERSION}" | sh
                  echo "$HOME/.meteor" >> "$GITHUB_PATH"
                  "$HOME/.meteor/meteor" --version
            - run: npm ci
            - run: meteor lint
            - run: npm run check:code-style

    tests:
        name: Unit tests
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: ['22.x', '24.x']
        defaults:
            run:
                shell: bash -l {0}
                working-directory: meteor-app
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
                  cache-dependency-path: 'meteor-app/package-lock.json'
            - name: Cache Meteor installation
              uses: actions/cache@v6
              with:
                  path: ~/.meteor
                  key: ${{ runner.os }}-meteor-${{ env.METEOR_VERSION }}
            - name: Install Meteor ${{ env.METEOR_VERSION }}
              run: |
                  curl "https://install.meteor.com/?release=${METEOR_VERSION}" | sh
                  echo "$HOME/.meteor" >> "$GITHUB_PATH"
                  "$HOME/.meteor/meteor" --version
            - run: meteor npm ci
            - run: meteor npm run build --if-present
            - run: meteor npm test

    app-e2e:
        name: App E2E
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 22
              uses: actions/setup-node@v6
              with:
                  node-version: '22.x'
                  cache: 'npm'
                  cache-dependency-path: |
                      package-lock.json
                      meteor-app/package-lock.json
            - name: Cache Meteor installation
              uses: actions/cache@v6
              with:
                  path: ~/.meteor
                  key: ${{ runner.os }}-meteor-${{ env.METEOR_VERSION }}
            - name: Install Meteor ${{ env.METEOR_VERSION }}
              run: |
                  curl "https://install.meteor.com/?release=${METEOR_VERSION}" | sh
                  echo "$HOME/.meteor" >> "$GITHUB_PATH"
                  "$HOME/.meteor/meteor" --version
            - run: npm ci --ignore-scripts
            - run: meteor npm ci --ignore-scripts
              working-directory: meteor-app
            - run: npx playwright install --with-deps chromium webkit
            - run: npm run test:e2e:app -- --workers=1 --reporter=line

    storybook-e2e:
        name: Storybook E2E
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 22
              uses: actions/setup-node@v6
              with:
                  node-version: '22.x'
                  cache: 'npm'
                  cache-dependency-path: |
                      package-lock.json
                      meteor-app/package-lock.json
            - run: npm ci --ignore-scripts
            - run: npm ci --ignore-scripts --prefix meteor-app
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e:storybook -- --project=storybook-chromium --workers=1 --reporter=line
