# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: App Tests
permissions:
    contents: read

env:
    METEOR_VERSION: 3.4.1

on:
    push:
        branches: ['master']
    pull_request:
        branches:
            - 'master'
            - 'twig/**'

concurrency:
    group: app-tests-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    script-tests:
        name: Script tests
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: ['22.x', '24.x']
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
                  cache-dependency-path: |
                      package-lock.json
                      meteor-app/package-lock.json
            - run: npm ci --ignore-scripts
            - run: npm ci --ignore-scripts --prefix meteor-app
            - run: npm run test:scripts

    type-check:
        name: Check types
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: ['22.x', '24.x']
        defaults:
            run:
                shell: bash -l {0}
                working-directory: meteor-app
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
                  cache-dependency-path: 'meteor-app/package-lock.json'
            - name: Cache Meteor installation
              uses: actions/cache@v6
              with:
                  path: ~/.meteor
                  key: ${{ runner.os }}-meteor-${{ env.METEOR_VERSION }}
            - name: Install Meteor ${{ env.METEOR_VERSION }}
              run: |
                  curl "https://install.meteor.com/?release=${METEOR_VERSION}" | sh
                  echo "$HOME/.meteor" >> "$GITHUB_PATH"
                  "$HOME/.meteor/meteor" --version
            - run: npm ci
            - run: meteor lint
            - run: npm run check:type

    code-style-check:
        name: Check coding styles
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: ['22.x', '24.x']
        defaults:
            run:
                shell: bash -l {0}
                working-directory: meteor-app
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
                  cache-dependency-path: 'meteor-app/package-lock.json'
            - name: Cache Meteor installation
              uses: actions/cache@v6
              with:
                  path: ~/.meteor
                  key: ${{ runner.os }}-meteor-${{ env.METEOR_VERSION }}
            - name: Install Meteor ${{ env.METEOR_VERSION }}
              run: |
                  curl "https://install.meteor.com/?release=${METEOR_VERSION}" | sh
                  echo "$HOME/.meteor" >> "$GITHUB_PATH"
                  "$HOME/.meteor/meteor" --version
            - run: npm ci
            - run: meteor lint
            - run: npm run check:code-style

    tests:
        name: Unit tests
        runs-on: ubuntu-latest
        env:
            INVENTORY_SEARCH_URL: http://127.0.0.1:7700
            INVENTORY_SEARCH_API_KEY: inventory-search-ci-key-at-least-32-characters
            INVENTORY_SEARCH_INDEX: inventory_unit_ci
        services:
            meilisearch:
                image: getmeili/meilisearch:v1.37.0
                env:
                    MEILI_ENV: production
                    MEILI_NO_ANALYTICS: 'true'
                    MEILI_MASTER_KEY: inventory-search-ci-key-at-least-32-characters
                ports:
                    - 7700:7700
                options: >-
                    --health-cmd "curl --fail --silent http://localhost:7700/health"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 24
        strategy:
            matrix:
                node-version: ['22.x', '24.x']
        defaults:
            run:
                shell: bash -l {0}
                working-directory: meteor-app
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
                  cache-dependency-path: 'meteor-app/package-lock.json'
            - name: Cache Meteor installation
              uses: actions/cache@v6
              with:
                  path: ~/.meteor
                  key: ${{ runner.os }}-meteor-${{ env.METEOR_VERSION }}
            - name: Install Meteor ${{ env.METEOR_VERSION }}
              run: |
                  curl "https://install.meteor.com/?release=${METEOR_VERSION}" | sh
                  echo "$HOME/.meteor" >> "$GITHUB_PATH"
                  "$HOME/.meteor/meteor" --version
            - run: meteor npm ci
            - run: meteor npm run build --if-present
            - run: meteor npm test

    app-e2e:
        name: App E2E (${{ matrix.project }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            INVENTORY_SEARCH_URL: http://127.0.0.1:7700
            INVENTORY_SEARCH_API_KEY: inventory-search-ci-key-at-least-32-characters
            INVENTORY_SEARCH_INDEX: inventory_app_e2e_${{ matrix.project }}
        services:
            meilisearch:
                image: getmeili/meilisearch:v1.37.0
                env:
                    MEILI_ENV: production
                    MEILI_NO_ANALYTICS: 'true'
                    MEILI_MASTER_KEY: inventory-search-ci-key-at-least-32-characters
                ports:
                    - 7700:7700
                options: >-
                    --health-cmd "curl --fail --silent http://localhost:7700/health"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 24
        strategy:
            fail-fast: false
            matrix:
                include:
                    - project: chromium
                      browser: chromium
                      artifact: chromium
                      tests: tests/e2e/app/
                    - project: iPad
                      browser: webkit
                      artifact: ipad
                      tests: tests/e2e/app/touch-optimization.spec.ts tests/e2e/app/ui-stabilization.spec.ts
                    - project: iPhone
                      browser: webkit
                      artifact: iphone
                      tests: tests/e2e/app/touch-optimization.spec.ts tests/e2e/app/ui-stabilization.spec.ts
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 22
              uses: actions/setup-node@v6
              with:
                  node-version: '22.x'
                  cache: 'npm'
                  cache-dependency-path: |
                      package-lock.json
                      meteor-app/package-lock.json
            - name: Cache Meteor installation
              uses: actions/cache@v6
              with:
                  path: ~/.meteor
                  key: ${{ runner.os }}-meteor-${{ env.METEOR_VERSION }}
            - name: Install Meteor ${{ env.METEOR_VERSION }}
              run: |
                  curl "https://install.meteor.com/?release=${METEOR_VERSION}" | sh
                  echo "$HOME/.meteor" >> "$GITHUB_PATH"
                  "$HOME/.meteor/meteor" --version
            - run: npm ci --ignore-scripts
            - run: meteor npm ci --ignore-scripts
              working-directory: meteor-app
            - run: npx playwright install --with-deps ${{ matrix.browser }}
            - run: npx playwright test ${{ matrix.tests }} --project=${{ matrix.project }} --workers=1 --reporter=line
            - name: Upload Playwright diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: app-e2e-${{ matrix.artifact }}-${{ github.run_attempt }}
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7

    app-e2e-status:
        name: App E2E
        runs-on: ubuntu-latest
        if: always()
        needs: app-e2e
        steps:
            - name: Verify App E2E matrix
              env:
                  MATRIX_RESULT: ${{ needs.app-e2e.result }}
              run: |
                  if [[ "$MATRIX_RESULT" != "success" ]]; then
                      echo "App E2E matrix result: $MATRIX_RESULT"
                      exit 1
                  fi

    storybook-e2e:
        name: Storybook E2E
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 22
              uses: actions/setup-node@v6
              with:
                  node-version: '22.x'
                  cache: 'npm'
                  cache-dependency-path: |
                      package-lock.json
                      meteor-app/package-lock.json
            - run: npm ci --ignore-scripts
            - run: npm ci --ignore-scripts --prefix meteor-app
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e:storybook -- --project=storybook-chromium --workers=1 --reporter=line

    agent-acceptance:
        name: Agent search acceptance
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            INVENTORY_SEARCH_URL: http://127.0.0.1:7700
            INVENTORY_SEARCH_API_KEY: inventory-search-ci-key-at-least-32-characters
            INVENTORY_SEARCH_INDEX: inventory_agent_acceptance
            INVENTORY_SEED_SAMPLE_DATA: '0'
        services:
            meilisearch:
                image: getmeili/meilisearch:v1.37.0
                env:
                    MEILI_ENV: production
                    MEILI_NO_ANALYTICS: 'true'
                    MEILI_MASTER_KEY: inventory-search-ci-key-at-least-32-characters
                ports:
                    - 7700:7700
                options: >-
                    --health-cmd "curl --fail --silent http://localhost:7700/health"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 24
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 22
              uses: actions/setup-node@v6
              with:
                  node-version: '22.x'
                  cache: 'npm'
                  cache-dependency-path: |
                      package-lock.json
                      meteor-app/package-lock.json
            - name: Cache Meteor installation
              uses: actions/cache@v6
              with:
                  path: ~/.meteor
                  key: ${{ runner.os }}-meteor-${{ env.METEOR_VERSION }}
            - name: Install Meteor ${{ env.METEOR_VERSION }}
              run: |
                  curl "https://install.meteor.com/?release=${METEOR_VERSION}" | sh
                  echo "$HOME/.meteor" >> "$GITHUB_PATH"
                  "$HOME/.meteor/meteor" --version
            - run: npm ci --ignore-scripts
            - run: npm ci --ignore-scripts --prefix meteor-app
            - run: npx playwright install --with-deps chromium
            - run: npx playwright test --config tests/acceptance/playwright.config.ts --reporter=line

    quality-gate:
        name: PR Quality Gate
        runs-on: ubuntu-latest
        if: always()
        needs:
            - script-tests
            - type-check
            - code-style-check
            - tests
            - app-e2e-status
            - storybook-e2e
            - agent-acceptance
        steps:
            - name: Verify required app checks
              env:
                  SCRIPT_TESTS: ${{ needs.script-tests.result }}
                  TYPE_CHECK: ${{ needs.type-check.result }}
                  CODE_STYLE: ${{ needs.code-style-check.result }}
                  UNIT_TESTS: ${{ needs.tests.result }}
                  APP_E2E: ${{ needs.app-e2e-status.result }}
                  STORYBOOK_E2E: ${{ needs.storybook-e2e.result }}
                  AGENT_ACCEPTANCE: ${{ needs.agent-acceptance.result }}
              run: |
                  failed=0
                  for result in \
                      "Script tests:${SCRIPT_TESTS}" \
                      "Type check:${TYPE_CHECK}" \
                      "Code style:${CODE_STYLE}" \
                      "Unit tests:${UNIT_TESTS}" \
                      "App E2E:${APP_E2E}" \
                      "Storybook E2E:${STORYBOOK_E2E}" \
                      "Agent acceptance:${AGENT_ACCEPTANCE}"; do
                      name="${result%%:*}"
                      status="${result#*:}"
                      echo "${name}: ${status}"
                      if [[ "${status}" != "success" ]]; then
                          failed=1
                      fi
                  done
                  exit "${failed}"
