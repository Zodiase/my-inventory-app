name: PR Visual Evidence

permissions:
    contents: write
    issues: write
    pull-requests: write

env:
    METEOR_VERSION: 3.3.2

on:
    pull_request:
        branches:
            - 'master'
            - 'twig/**'
        paths:
            - '.github/workflows/pr-visual-evidence.yml'
            - 'meteor-app/client/**'
            - 'meteor-app/imports/ui/**'
            - 'meteor-app/package-lock.json'
            - 'meteor-app/package.json'
            - 'package-lock.json'
            - 'package.json'
            - 'playwright.config.js'
            - 'tests/e2e/app/search-and-filter.spec.ts'
            - 'tests/e2e/app/visual-artifacts/**'
            - 'tests/e2e/helpers/**'

concurrency:
    group: pr-visual-evidence-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    items-add-filter:
        name: Items Add Filter before/after
        runs-on: ubuntu-latest
        if: github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 30
        steps:
            - name: Check out base
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  path: base

            - name: Check out head
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  path: head

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.x'
                  cache: 'npm'
                  cache-dependency-path: |
                      base/package-lock.json
                      base/meteor-app/package-lock.json
                      head/package-lock.json
                      head/meteor-app/package-lock.json

            - name: Cache Meteor installation
              uses: actions/cache@v4
              with:
                  path: ~/.meteor
                  key: ${{ runner.os }}-meteor-${{ env.METEOR_VERSION }}

            - name: Install Meteor
              shell: bash
              run: |
                  curl "https://install.meteor.com/?release=${METEOR_VERSION}" | sh
                  echo "$HOME/.meteor" >> "$GITHUB_PATH"
                  "$HOME/.meteor/meteor" --version

            - name: Install dependencies
              shell: bash
              run: |
                  npm ci --ignore-scripts --prefix base
                  npm ci --ignore-scripts --prefix head
                  cd base/meteor-app
                  meteor npm ci --ignore-scripts
                  cd ../../head/meteor-app
                  meteor npm ci --ignore-scripts

            - name: Install Chromium
              shell: bash
              run: |
                  cd base
                  npx playwright install --with-deps chromium
                  cd ../head
                  npx playwright install chromium

            - name: Copy visual capture spec to base checkout
              shell: bash
              run: |
                  mkdir -p base/tests/e2e/app/visual-artifacts
                  cp head/tests/e2e/app/visual-artifacts/items-add-filter.spec.ts base/tests/e2e/app/visual-artifacts/items-add-filter.spec.ts

            - name: Compute artifact names
              id: refs
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  echo "base-short=${BASE_SHA:0:7}" >> "$GITHUB_OUTPUT"
                  echo "head-short=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
                  echo "before-file=before-base-${BASE_SHA:0:7}.png" >> "$GITHUB_OUTPUT"
                  echo "after-file=after-pr-${HEAD_SHA:0:7}.png" >> "$GITHUB_OUTPUT"

            - name: Capture base visual
              shell: bash
              working-directory: base
              env:
                  PLAYWRIGHT_APP_PORT: '3201'
                  PLAYWRIGHT_METEOR_LOCAL_DIR: ${{ runner.temp }}/meteor-base
                  VISUAL_OUTPUT_DIR: ${{ runner.temp }}/items-add-filter-visual
                  VISUAL_SNAPSHOT_NAME: before-base-${{ steps.refs.outputs.base-short }}
              run: |
                  npm run test:e2e:chromium -- tests/e2e/app/visual-artifacts/items-add-filter.spec.ts --reporter=line

            - name: Capture head visual
              shell: bash
              working-directory: head
              env:
                  PLAYWRIGHT_APP_PORT: '3202'
                  PLAYWRIGHT_METEOR_LOCAL_DIR: ${{ runner.temp }}/meteor-head
                  VISUAL_OUTPUT_DIR: ${{ runner.temp }}/items-add-filter-visual
                  VISUAL_SNAPSHOT_NAME: after-pr-${{ steps.refs.outputs.head-short }}
              run: |
                  npm run test:e2e:chromium -- tests/e2e/app/visual-artifacts/items-add-filter.spec.ts --reporter=line

            - name: Upload screenshot artifact
              id: upload
              uses: actions/upload-artifact@v4
              with:
                  name: items-add-filter-before-after
                  path: ${{ runner.temp }}/items-add-filter-visual/*.png
                  if-no-files-found: error

            - name: Publish screenshots to repo artifact branch
              id: publish
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  ARTIFACT_BRANCH: visual-artifacts
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  BEFORE_FILE: ${{ steps.refs.outputs.before-file }}
                  AFTER_FILE: ${{ steps.refs.outputs.after-file }}
              run: |
                  artifact_repo="${RUNNER_TEMP}/visual-artifacts-repo"
                  artifact_parent="pr-${PR_NUMBER}/items-add-filter"
                  artifact_dir="${artifact_parent}/run-${GITHUB_RUN_ID}"

                  git init "${artifact_repo}"
                  cd "${artifact_repo}"
                  git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

                  if git ls-remote --exit-code --heads origin "${ARTIFACT_BRANCH}"; then
                      git fetch --depth=1 origin "${ARTIFACT_BRANCH}"
                      git checkout -B "${ARTIFACT_BRANCH}" "origin/${ARTIFACT_BRANCH}"
                  else
                      git checkout --orphan "${ARTIFACT_BRANCH}"
                  fi

                  rm -rf "${artifact_parent}"
                  mkdir -p "${artifact_dir}"
                  cp "${RUNNER_TEMP}/items-add-filter-visual/${BEFORE_FILE}" "${artifact_dir}/${BEFORE_FILE}"
                  cp "${RUNNER_TEMP}/items-add-filter-visual/${AFTER_FILE}" "${artifact_dir}/${AFTER_FILE}"

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add "${artifact_parent}"

                  if git diff --cached --quiet; then
                      echo "No screenshot changes to publish."
                  else
                      git commit -m "Add visual artifacts for PR #${PR_NUMBER}"
                      git push origin "HEAD:${ARTIFACT_BRANCH}"
                  fi

                  raw_root="https://github.com/${GITHUB_REPOSITORY}/blob/${ARTIFACT_BRANCH}/${artifact_dir}"
                  echo "before-url=${raw_root}/${BEFORE_FILE}" >> "$GITHUB_OUTPUT"
                  echo "after-url=${raw_root}/${AFTER_FILE}" >> "$GITHUB_OUTPUT"

            - name: Comment on pull request
              uses: actions/github-script@v7
              env:
                  BASE_SHORT: ${{ steps.refs.outputs.base-short }}
                  HEAD_SHORT: ${{ steps.refs.outputs.head-short }}
                  BEFORE_URL: ${{ steps.publish.outputs.before-url }}
                  AFTER_URL: ${{ steps.publish.outputs.after-url }}
                  ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
              with:
                  script: |
                      const marker = '<!-- items-add-filter-visual-evidence -->';
                      const body = [
                          marker,
                          '## Visual evidence: Items Add Filter panel',
                          '',
                          'Captured by CI at 2048x768 with one `Garage` container and the expanded **Add Filters** panel.',
                          '',
                          `| Before base \`${process.env.BASE_SHORT}\` | After PR \`${process.env.HEAD_SHORT}\` |`,
                          '| --- | --- |',
                          `| <img src="${process.env.BEFORE_URL}?raw=1" alt="Before: Garage row overlaps the Add Filter controls" width="100%"> | <img src="${process.env.AFTER_URL}?raw=1" alt="After: Garage row is below the expanded Add Filter panel" width="100%"> |`,
                          '',
                          'The E2E regression also asserts that the first item row starts at least 8px below the Add Filter panel and that the page does not horizontally overflow.',
                          '',
                          `[Download screenshot artifact](${process.env.ARTIFACT_URL})`,
                      ].join('\n');

                      const { owner, repo } = context.repo;
                      const issue_number = context.issue.number;
                      const comments = await github.paginate(github.rest.issues.listComments, {
                          owner,
                          repo,
                          issue_number,
                      });
                      const existing = comments.find((comment) =>
                          comment.user?.type === 'Bot' && comment.body?.includes(marker)
                      );

                      if (existing) {
                          await github.rest.issues.updateComment({
                              owner,
                              repo,
                              comment_id: existing.id,
                              body,
                          });
                      } else {
                          await github.rest.issues.createComment({
                              owner,
                              repo,
                              issue_number,
                              body,
                          });
                      }

            - name: Verify head layout regression
              shell: bash
              working-directory: head
              env:
                  PLAYWRIGHT_APP_PORT: '3203'
                  PLAYWRIGHT_METEOR_LOCAL_DIR: ${{ runner.temp }}/meteor-head-regression
              run: |
                  npm run test:e2e:chromium -- tests/e2e/app/search-and-filter.spec.ts --grep "Items Add Filter panel contains controls without overlapping the item list" --reporter=line
