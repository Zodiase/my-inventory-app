name: PR Visual Evidence

permissions:
    contents: read
    pull-requests: read

env:
    METEOR_VERSION: 3.3.2

on:
    pull_request:
        branches:
            - 'master'
            - 'twig/**'
        paths:
            - '.github/workflows/pr-visual-evidence.yml'
            - 'meteor-app/client/**'
            - 'meteor-app/imports/api/**'
            - 'meteor-app/imports/model/**'
            - 'meteor-app/imports/ui/**'
            - 'meteor-app/imports/utility/**'
            - 'meteor-app/package-lock.json'
            - 'meteor-app/package.json'
            - 'package-lock.json'
            - 'package.json'
            - 'playwright.config.js'
            - 'scripts/visual-diff-report.mjs'
            - 'scripts/visual-diff-report.test.mjs'
            - 'scripts/visual-scenarios.mjs'
            - 'scripts/visual-scenarios.test.mjs'
            - 'tests/e2e/app/**'
            - 'tests/e2e/helpers/**'

concurrency:
    group: pr-visual-evidence-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    select-visual-scenarios:
        name: Select visual scenarios
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        timeout-minutes: 5
        outputs:
            has-scenarios: ${{ steps.select.outputs.has-scenarios }}
            scenario-count: ${{ steps.select.outputs.scenario-count }}
            scenario-slugs: ${{ steps.select.outputs.scenario-slugs }}
            selection-json: ${{ steps.select.outputs.selection-json }}
        steps:
            - name: Check out head
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            - name: Collect changed files
              uses: actions/github-script@v7
              env:
                  CHANGED_FILES_PATH: ${{ runner.temp }}/changed-files.txt
              with:
                  script: |
                      const fs = require('fs');
                      const { owner, repo } = context.repo;
                      const pull_number = context.issue.number;
                      const files = await github.paginate(github.rest.pulls.listFiles, {
                          owner,
                          repo,
                          pull_number,
                          per_page: 100,
                      });
                      const filenames = files.map((file) => file.filename).sort();
                      fs.writeFileSync(process.env.CHANGED_FILES_PATH, filenames.join('\n'));
                      core.info(`Collected ${filenames.length} changed files.`);

            - name: Select scenarios
              id: select
              shell: bash
              run: |
                  node scripts/visual-scenarios.mjs select \
                      --changed-files "${RUNNER_TEMP}/changed-files.txt" \
                      --github-output "${GITHUB_OUTPUT}"

    visual-evidence:
        name: Visual before/after evidence
        runs-on: ubuntu-latest
        needs: select-visual-scenarios
        if: github.event.pull_request.head.repo.full_name == github.repository && needs.select-visual-scenarios.outputs.has-scenarios == 'true'
        permissions:
            contents: read
        timeout-minutes: 30
        outputs:
            artifact-url: ${{ steps.upload.outputs.artifact-url }}
        steps:
            - name: Check out base
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  path: base
                  persist-credentials: false

            - name: Check out head
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  path: head
                  persist-credentials: false

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.x'
                  cache: 'npm'
                  cache-dependency-path: |
                      base/package-lock.json
                      base/meteor-app/package-lock.json
                      head/package-lock.json
                      head/meteor-app/package-lock.json

            - name: Cache Meteor installation
              uses: actions/cache@v4
              with:
                  path: ~/.meteor
                  key: ${{ runner.os }}-meteor-${{ env.METEOR_VERSION }}

            - name: Install Meteor
              shell: bash
              run: |
                  curl "https://install.meteor.com/?release=${METEOR_VERSION}" | sh
                  echo "$HOME/.meteor" >> "$GITHUB_PATH"
                  "$HOME/.meteor/meteor" --version

            - name: Install dependencies
              shell: bash
              run: |
                  npm ci --ignore-scripts --prefix base
                  npm ci --ignore-scripts --prefix head
                  cd base/meteor-app
                  meteor npm ci --ignore-scripts
                  cd ../../head/meteor-app
                  meteor npm ci --ignore-scripts

            - name: Install Chromium
              shell: bash
              run: |
                  cd base
                  npx playwright install --with-deps chromium
                  cd ../head
                  npx playwright install chromium

            - name: Copy visual capture files to base checkout
              shell: bash
              run: |
                  mkdir -p base/tests/e2e/app/visual-artifacts
                  cp head/tests/e2e/app/visual-artifacts/pr-visual-evidence.spec.ts base/tests/e2e/app/visual-artifacts/pr-visual-evidence.spec.ts

            - name: Compute artifact names
              id: refs
              shell: bash
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  echo "base-short=${BASE_SHA:0:7}" >> "$GITHUB_OUTPUT"
                  echo "head-short=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

            - name: Capture base visuals
              shell: bash
              working-directory: base
              env:
                  PLAYWRIGHT_APP_PORT: '3201'
                  PLAYWRIGHT_METEOR_LOCAL_DIR: ${{ runner.temp }}/meteor-base
                  VISUAL_OUTPUT_DIR: ${{ runner.temp }}/pr-visual-evidence
                  VISUAL_REF_KIND: before
                  VISUAL_REF_SHORT: ${{ steps.refs.outputs.base-short }}
                  VISUAL_SELECTION_JSON: ${{ needs.select-visual-scenarios.outputs.selection-json }}
              run: |
                  npm run test:e2e:chromium -- tests/e2e/app/visual-artifacts/pr-visual-evidence.spec.ts --reporter=line

            - name: Capture head visuals
              shell: bash
              working-directory: head
              env:
                  PLAYWRIGHT_APP_PORT: '3202'
                  PLAYWRIGHT_METEOR_LOCAL_DIR: ${{ runner.temp }}/meteor-head
                  VISUAL_OUTPUT_DIR: ${{ runner.temp }}/pr-visual-evidence
                  VISUAL_REF_KIND: after
                  VISUAL_REF_SHORT: ${{ steps.refs.outputs.head-short }}
                  VISUAL_SELECTION_JSON: ${{ needs.select-visual-scenarios.outputs.selection-json }}
              run: |
                  npm run test:e2e:chromium -- tests/e2e/app/visual-artifacts/pr-visual-evidence.spec.ts --reporter=line

            - name: Analyze visual diffs
              id: visual-diff
              shell: bash
              working-directory: head
              env:
                  BASE_SHORT: ${{ steps.refs.outputs.base-short }}
                  HEAD_SHORT: ${{ steps.refs.outputs.head-short }}
                  VISUAL_OUTPUT_DIR: ${{ runner.temp }}/pr-visual-evidence
                  VISUAL_SELECTION_JSON: ${{ needs.select-visual-scenarios.outputs.selection-json }}
              run: |
                  node scripts/visual-diff-report.mjs build \
                      --screenshot-dir "${VISUAL_OUTPUT_DIR}" \
                      --base-short "${BASE_SHORT}" \
                      --head-short "${HEAD_SHORT}" \
                      --report-json "${VISUAL_OUTPUT_DIR}/visual-diff-report.json" \
                      --github-output "${GITHUB_OUTPUT}"

            - name: Upload screenshot artifact
              id: upload
              uses: actions/upload-artifact@v4
              with:
                  name: pr-visual-evidence
                  path: |
                      ${{ runner.temp }}/pr-visual-evidence/*.png
                      ${{ runner.temp }}/pr-visual-evidence/visual-diff-report.json
                  if-no-files-found: error

    publish-visual-evidence:
        name: Publish visual evidence comment
        runs-on: ubuntu-latest
        needs:
            - select-visual-scenarios
            - visual-evidence
        if: github.event.pull_request.head.repo.full_name == github.repository && needs.select-visual-scenarios.outputs.has-scenarios == 'true'
        permissions:
            actions: read
            contents: write
            issues: write
            pull-requests: read
        timeout-minutes: 10
        steps:
            - name: Download screenshot artifact
              uses: actions/download-artifact@v4
              with:
                  name: pr-visual-evidence
                  path: ${{ runner.temp }}/pr-visual-evidence

            - name: Publish screenshots to repo artifact branch
              id: publish
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  ARTIFACT_BRANCH: visual-artifacts
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  SCREENSHOT_DIR: ${{ runner.temp }}/pr-visual-evidence
              run: |
                  artifact_repo="${RUNNER_TEMP}/visual-artifacts-repo"
                  artifact_parent="pr-${PR_NUMBER}/visual-evidence"
                  artifact_dir="${artifact_parent}/run-${GITHUB_RUN_ID}"

                  git init "${artifact_repo}"
                  cd "${artifact_repo}"
                  git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

                  if git ls-remote --exit-code --heads origin "${ARTIFACT_BRANCH}"; then
                      git fetch --depth=1 origin "${ARTIFACT_BRANCH}"
                      git checkout -B "${ARTIFACT_BRANCH}" "origin/${ARTIFACT_BRANCH}"
                  else
                      git checkout --orphan "${ARTIFACT_BRANCH}"
                  fi

                  rm -rf "${artifact_parent}"
                  mkdir -p "${artifact_dir}"
                  cp "${SCREENSHOT_DIR}"/*.png "${artifact_dir}/"

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add "${artifact_parent}"

                  if git diff --cached --quiet; then
                      echo "No screenshot changes to publish."
                  else
                      git commit -m "Add visual artifacts for PR #${PR_NUMBER}"
                      git push origin "HEAD:${ARTIFACT_BRANCH}"
                  fi

                  raw_root="https://github.com/${GITHUB_REPOSITORY}/blob/${ARTIFACT_BRANCH}/${artifact_dir}"
                  echo "published-root=${raw_root}" >> "$GITHUB_OUTPUT"

            - name: Comment on pull request
              uses: actions/github-script@v7
              env:
                  ARTIFACT_URL: ${{ needs.visual-evidence.outputs.artifact-url }}
                  PUBLISHED_ROOT: ${{ steps.publish.outputs.published-root }}
                  VISUAL_REPORT_JSON: ${{ runner.temp }}/pr-visual-evidence/visual-diff-report.json
              with:
                  script: |
                      const fs = require('fs');
                      const marker = '<!-- pr-visual-evidence -->';
                      const legacyMarker = '<!-- items-add-filter-visual-evidence -->';
                      const report = JSON.parse(fs.readFileSync(process.env.VISUAL_REPORT_JSON, 'utf8'));
                      const artifactUrl = process.env.ARTIFACT_URL;
                      const publishedRoot = process.env.PUBLISHED_ROOT;

                      function escapeHtml(value) {
                          return String(value)
                              .replaceAll('&', '&amp;')
                              .replaceAll('<', '&lt;')
                              .replaceAll('>', '&gt;')
                              .replaceAll('"', '&quot;');
                      }

                      function formatPercent(value) {
                          if (value === 0) return '0%';
                          if (value < 0.01) return '<0.01%';
                          if (value < 1) return `${value.toFixed(2)}%`;
                          return `${value.toFixed(1)}%`;
                      }

                      function summarizeFiles(files = []) {
                          if (files.length === 0) return '';
                          const shown = files
                              .slice(0, 5)
                              .map((file) => `\`${file}\``)
                              .join(', ');
                          return files.length > 5 ? `${shown}, +${files.length - 5} more` : shown;
                      }

                      function imageUrl(file) {
                          return `${publishedRoot}/${file}?raw=1`;
                      }

                      function statusText(status) {
                          if (status === 'changed') return 'Changed';
                          if (status === 'unchanged') return 'Unchanged';
                          return 'Missing';
                      }

                      function scenarioRows(group) {
                          return report.scenarios
                              .filter((scenario) => scenario.groupId === group.id)
                              .map((scenario) => {
                                  let evidence = artifactUrl === '' ? '-' : `<a href="${escapeHtml(artifactUrl)}">Artifact</a>`;
                                  if (scenario.status === 'changed' && scenario.files.composite !== undefined) {
                                      evidence = [
                                          `<a href="${escapeHtml(imageUrl(scenario.files.composite))}">Overlay</a>`,
                                          `<a href="${escapeHtml(imageUrl(scenario.files.diff))}">Raw diff</a>`,
                                      ].join(' · ');
                                  }

                                  return [
                                      '<tr>',
                                      `<td><strong>${escapeHtml(scenario.label)}</strong><br><code>${escapeHtml(scenario.slug)}</code></td>`,
                                      `<td>${statusText(scenario.status)}</td>`,
                                      `<td><code>${formatPercent(scenario.changedPercent)}</code><br>${scenario.changedPixels} px</td>`,
                                      `<td>${evidence}</td>`,
                                      '</tr>',
                                  ].join('\n');
                              })
                              .join('\n');
                      }

                      function groupSections() {
                          return report.groups
                              .map((group) =>
                                  [
                                      '<details open>',
                                      `<summary><strong>${escapeHtml(group.label)}</strong> - ${group.summary.changed} changed, ${group.summary.unchanged} unchanged, ${group.summary.missing} missing</summary>`,
                                      '',
                                      '<table>',
                                      '<thead>',
                                      '<tr>',
                                      '<th>Scenario</th>',
                                      '<th>Status</th>',
                                      '<th>Delta</th>',
                                      '<th>Evidence</th>',
                                      '</tr>',
                                      '</thead>',
                                      '<tbody>',
                                      scenarioRows(group),
                                      '</tbody>',
                                      '</table>',
                                      '</details>',
                                  ].join('\n')
                              )
                              .join('\n\n');
                      }

                      function selectionSummary() {
                          return report.groups
                              .map((group) => {
                                  const files = summarizeFiles(group.matchedFiles);
                                  return `- **${group.label}**: ${group.reason}${files === '' ? '' : ` (${files})`}`;
                              })
                              .join('\n');
                      }

                      function changedEvidenceGallery() {
                          const changed = report.scenarios.filter(
                              (scenario) => scenario.status === 'changed' && scenario.files.composite !== undefined
                          );
                          if (changed.length === 0) return '_No visual changes exceeded the configured threshold._';

                          return changed
                              .map((scenario) =>
                                  [
                                      '<details open>',
                                      `<summary><strong>${escapeHtml(scenario.label)}</strong> - ${formatPercent(scenario.changedPercent)} changed</summary>`,
                                      '',
                                      `<a href="${escapeHtml(imageUrl(scenario.files.composite))}"><img src="${escapeHtml(imageUrl(scenario.files.composite))}" alt="Overlay visual diff for ${escapeHtml(scenario.label)}" width="900"></a>`,
                                      '</details>',
                                  ].join('\n')
                              )
                              .join('\n\n');
                      }

                      const summary = report.summary;
                      const threshold = report.threshold;
                      const lines = [
                          marker,
                          '## Visual evidence',
                          '',
                          `Captured ${summary.total} selected scenario${summary.total === 1 ? '' : 's'} from the PR diff.`,
                          '',
                          `Result: **${summary.changed} changed**, **${summary.unchanged} unchanged**, **${summary.missing} missing**.`,
                          `Threshold: ${formatPercent(threshold.changedPercentThreshold)} of pixels changed after per-channel delta > ${threshold.pixelDeltaThreshold}.`,
                          'Changed snapshots show a translucent red overlay on the after screenshot, with before/after crops below.',
                          '',
                          selectionSummary(),
                          '',
                          groupSections(),
                          '',
                          '### Changed visual evidence',
                          '',
                          changedEvidenceGallery(),
                      ];

                      if (artifactUrl !== '') {
                          lines.push('', `[Download full screenshot artifact](${artifactUrl})`);
                      }

                      const body = lines.join('\n');

                      const { owner, repo } = context.repo;
                      const issue_number = context.issue.number;
                      const comments = await github.paginate(github.rest.issues.listComments, {
                          owner,
                          repo,
                          issue_number,
                      });
                      const existing = comments.find(
                          (comment) =>
                              comment.user?.type === 'Bot' &&
                              (comment.body?.includes(marker) || comment.body?.includes(legacyMarker))
                      );

                      if (existing) {
                          await github.rest.issues.updateComment({
                              owner,
                              repo,
                              comment_id: existing.id,
                              body,
                          });
                      } else {
                          await github.rest.issues.createComment({
                              owner,
                              repo,
                              issue_number,
                              body,
                          });
                      }

    verify-selected-head-layout-regression:
        name: Verify selected head layout regression
        runs-on: ubuntu-latest
        needs: select-visual-scenarios
        if: github.event.pull_request.head.repo.full_name == github.repository && needs.select-visual-scenarios.outputs.has-scenarios == 'true'
        permissions:
            contents: read
        timeout-minutes: 20
        steps:
            - name: Check out head
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.x'
                  cache: 'npm'
                  cache-dependency-path: |
                      package-lock.json
                      meteor-app/package-lock.json

            - name: Cache Meteor installation
              uses: actions/cache@v4
              with:
                  path: ~/.meteor
                  key: ${{ runner.os }}-meteor-${{ env.METEOR_VERSION }}

            - name: Install Meteor
              shell: bash
              run: |
                  curl "https://install.meteor.com/?release=${METEOR_VERSION}" | sh
                  echo "$HOME/.meteor" >> "$GITHUB_PATH"
                  "$HOME/.meteor/meteor" --version

            - name: Install dependencies
              shell: bash
              run: |
                  npm ci --ignore-scripts
                  cd meteor-app
                  meteor npm ci --ignore-scripts

            - name: Install Chromium
              shell: bash
              run: |
                  npx playwright install --with-deps chromium

            - name: Verify selected head layout regression
              shell: bash
              env:
                  PLAYWRIGHT_APP_PORT: '3203'
                  PLAYWRIGHT_METEOR_LOCAL_DIR: ${{ runner.temp }}/meteor-head-regression
                  SCENARIO_SLUGS: ${{ needs.select-visual-scenarios.outputs.scenario-slugs }}
              run: |
                  if [[ ",${SCENARIO_SLUGS}," == *",items-add-filter,"* ]]; then
                      npm run test:e2e:chromium -- tests/e2e/app/search-and-filter.spec.ts --grep "Items Add Filter panel contains controls without overlapping the item list" --reporter=line
                  else
                      echo "Skipping Items Add Filter regression; scenario was not selected."
                  fi
