## Error Responses

### Invalid Route
```yaml
error: invalid_route
  url_pattern: /:rest*
  status: 404 (semantic, not HTTP - SPA returns 200)
  display: NotFoundView component
  message: "Page not found"
  actions:
    - label: "Go to Items"
      link: /items
    - label: "Go to Tags"
      link: /tags
  example: User navigates to /admin/users (not implemented)
```

### Invalid Parameter Format
```yaml
error: invalid_param_format
  url_pattern: /items/:itemId or /tags/:tagId
  validation: itemId/tagId doesn't match MongoDB ObjectId pattern
  status: 400 (semantic)
  display: Error message within view component
  message: "Invalid {item|tag} ID format"
  actions:
    - label: "Back to {Items|Tags}"
      link: /items or /tags
  example: /items/not-a-valid-id
```

### Resource Not Found
```yaml
error: resource_not_found
  url_pattern: /items/:itemId or /tags/:tagId
  validation: Valid ID format but resource doesn't exist in DB
  status: 404 (semantic)
  display: Error message within view component
  message: "{Item|Tag} not found"
  actions:
    - label: "Back to {Items|Tags}"
      link: /items or /tags
  example: /items/507f1f77bcf86cd799439011 (item was deleted)
```

