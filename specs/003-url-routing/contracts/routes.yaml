## Testing Contract

### E2E Test Expectations

```yaml
test_category: page_object_navigation
  pattern: |
    const tagsPage = new TagsPage(page);
    await tagsPage.goto();  // Navigates to /tags
  expectation: URL changes to /tags, AllTagsView renders
  blocked_tests: T012 (currently blocked, will pass after routing)

test_category: browser_navigation
  scenarios:
    - Click Items → back button → should show previous view
    - Navigate to item detail → refresh → should show same item
    - Navigate to /tags → forward → should move forward in history

test_category: deep_linking
  scenarios:
    - Open /items/abc123 in new tab → shows item detail
    - Bookmark /tags → opening bookmark shows tags
    - Share /search link → recipient sees search view
```

### Route Validation Tests

```yaml
test_case: invalid_route
  url: /admin/users
  expected: NotFoundView renders

test_case: invalid_item_id
  url: /items/not-valid-id
  expected: "Invalid item ID" or "Item not found" error

test_case: deleted_resource
  setup: Create item, navigate to detail, delete item, refresh
  expected: "Item not found" error with link to /items
```

