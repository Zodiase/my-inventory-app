## TypeScript Type Contracts

```typescript
// Route parameter types
interface RouteParams {
  itemId?: string;
  tagId?: string;
}

// Route component props
interface RouteComponentProps {
  // Components read params via useParams hook
  // No props passed by router
}

// Navigation function type
type SetLocation = (path: string) => void;

// Location hook return type
type UseLocationReturn = [
  location: string,
  setLocation: SetLocation
];

// Params hook return type
type UseParamsReturn<T> = Partial<T>;

// Example usage
const ItemDetailView: React.FC = () => {
  const { itemId } = useParams<{ itemId: string }>();
  // itemId: string | undefined
};
```

