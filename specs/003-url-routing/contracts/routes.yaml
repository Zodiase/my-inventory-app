## State Management

### URL as Source of Truth

```yaml
pattern: url_driven_state
  principle: URL determines what user sees
  implementation: |
    // URL controls view
    <Route path="/items" component={AllItemsView} />

    // URL controls detail view
    <Route path="/items/:itemId">
      <ItemDetailView />
    </Route>
  benefits:
    - Bookmarkable URLs work automatically
    - Browser back/forward work automatically
    - Shareable URLs work automatically
    - Page refresh preserves state
  migration: |
    Before: const [currentView, setCurrentView] = useState('items');
    After: URL /items determines AllItemsView renders
```

### Component-Local State Preserved

```yaml
pattern: non_url_state
  principle: Not all state needs to be in URL
  preserved_state:
    - searchQuery: String (within SearchResultsView)
    - itemsViewFilters: SearchFragment[] (within AllItemsView)
    - showFilterBuilder: Boolean (UI toggle)
    - showCreateItem: Boolean (modal state)
  behavior: Lost on navigation (acceptable per spec)
  future_enhancement: |
    Could add to URL query params:
    - /search?q=camping
    - /items?container=true
    But not in MVP scope
```

