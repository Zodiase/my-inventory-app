# Route Definitions Contract

**Version**: 1.0.0
**Date**: 2025-11-30
**Format**: YAML
**Purpose**: Define all application routes with parameters, validation, and error handling

---

## Route Configuration

### Base Routes (No Parameters)

#### Home Route
```yaml
route:
  path: /
  exact: true
  component: AllItemsView
  description: Default landing page showing all items
  params: none
  query_params: none
  redirects: null
  authorization: public
```

#### Items List Route
```yaml
route:
  path: /items
  exact: true
  component: AllItemsView
  description: Explicit items list view (same as home)
  params: none
  query_params: none
  redirects: null
  authorization: public
```

#### Tags List Route
```yaml
route:
  path: /tags
  exact: true
  component: AllTagsView
  description: View all tags in hierarchical structure
  params: none
  query_params: none
  redirects: null
  authorization: public
  notes: |
    CRITICAL: This route unblocks T012 integration tests
    Tests expect tagsPage.goto('/tags') to work
```

#### Search Route
```yaml
route:
  path: /search
  exact: true
  component: SearchResultsView
  description: Search interface for finding items
  params: none
  query_params:
    - name: q
      type: string
      required: false
      description: Search query (future enhancement, not MVP)
  redirects: null
  authorization: public
```

---

### Parameterized Routes

#### Item Detail Route
```yaml
route:
  path: /items/:itemId
  exact: true
  component: ItemDetailView
  description: Display single item details by ID
  params:
    - name: itemId
      type: string
      pattern: ^[a-f0-9]{17,24}$  # MongoDB ObjectId pattern
      required: true
      description: MongoDB _id of the item
      validation:
        - Must be valid MongoDB ObjectId format
        - Must exist in InventoryItem collection
      error_handling:
        invalid_format: Show "Invalid item ID" error
        not_found: Show "Item not found" error with link to /items
  redirects: null
  authorization: public
  example: /items/507f1f77bcf86cd799439011
```

#### Tag Filter Route
```yaml
route:
  path: /tags/:tagId
  exact: true
  component: ItemsByTagView
  description: Display items filtered by specific tag
  params:
    - name: tagId
      type: string
      pattern: ^[a-f0-9]{17,24}$  # MongoDB ObjectId pattern
      required: true
      description: MongoDB _id of the tag
      validation:
        - Must be valid MongoDB ObjectId format
        - Must exist in TagRecord collection
      error_handling:
        invalid_format: Show "Invalid tag ID" error
        not_found: Show "Tag not found" error with link to /tags
  redirects: null
  authorization: public
  example: /tags/507f1f77bcf86cd799439012
```

---

### Catchall Route

#### Not Found Route
```yaml
route:
  path: /:rest*
  exact: false
  component: NotFoundView
  description: Catch-all for invalid URLs
  params:
    - name: rest
      type: string
      required: false
      description: Any unmatched path segments
  redirects: null
  authorization: public
  error_handling:
    display: Show "Page not found" message with links to home/items/tags
  examples:
    - /invalid/path
    - /items/tags/mixed
    - /users/profile  # No users feature exists
```

