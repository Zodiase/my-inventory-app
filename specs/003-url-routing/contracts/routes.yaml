## Performance Characteristics

### Navigation Speed

```yaml
metric: url_update_latency
  target: <100ms from click to URL update
  implementation: Wouter uses synchronous History API
  measurement: Time from Link click to location.pathname change

metric: component_render_latency
  target: <50ms from route match to component mount
  implementation: React re-render triggered by location change
  measurement: Time from location change to component onMount

metric: total_navigation_time
  target: <200ms from click to view displayed (no data fetch)
  calculation: url_update + component_render + initial_render
  notes: Excludes Meteor data subscription time
```

### Bundle Size Impact

```yaml
metric: routing_library_size
  library: wouter@3.x
  gzipped: 2.1 KB
  impact: <0.5% of typical app bundle
  comparison:
    react_router_v6: 18.7 KB (8.9x larger)
    tanstack_router: 12.5 KB (5.9x larger)
```

