## Navigation Actions

### Link-Based Navigation (Declarative)

```yaml
action: navigate_to_items
  method: declarative
  implementation: <Link href="/items">Items</Link>
  trigger: User clicks navigation button
  effect: Updates URL, renders AllItemsView
  history: Adds entry to browser history stack

action: navigate_to_tags
  method: declarative
  implementation: <Link href="/tags">Tags</Link>
  trigger: User clicks navigation button
  effect: Updates URL, renders AllTagsView
  history: Adds entry to browser history stack
  notes: Unblocks T012 tests

action: navigate_to_item_detail
  method: declarative
  implementation: <Link href={`/items/${item._id}`}>View Item</Link>
  trigger: User clicks item in list
  effect: Updates URL with item ID, renders ItemDetailView
  history: Adds entry to browser history stack
```

### Programmatic Navigation (Imperative)

```yaml
action: programmatic_navigation
  method: imperative
  implementation: |
    const [, setLocation] = useLocation();
    setLocation('/tags');
  trigger: After form submission, delete action, etc.
  effect: Updates URL, renders new view
  history: Adds entry to browser history stack
  use_cases:
    - Redirect after creating item → setLocation(`/items/${newItemId}`)
    - Redirect after deleting item → setLocation('/items')
    - Navigate on search submit → setLocation('/search')
```

### Browser Navigation

```yaml
action: browser_back
  method: browser_native
  implementation: Browser back button or swipe gesture
  trigger: User clicks back or swipes from edge
  effect: Pops history stack, navigates to previous URL
  history: Moves backward in stack

action: browser_forward
  method: browser_native
  implementation: Browser forward button
  trigger: User clicks forward button
  effect: Moves forward in history stack if available
  history: Moves forward in stack

action: page_refresh
  method: browser_native
  implementation: F5, Cmd+R, or refresh button
  trigger: User refreshes page
  effect: Reloads HTML, re-mounts app, re-navigates to current URL
  history: Maintains current position in stack
```

