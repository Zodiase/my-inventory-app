## Route Precedence

**Order matters** - routes matched top to bottom:

1. `/` (exact match)
2. `/items` (exact match)
3. `/tags` (exact match)
4. `/search` (exact match)
5. `/items/:itemId` (parameterized)
6. `/tags/:tagId` (parameterized)
7. `/:rest*` (catchall)

**Example**:
- URL `/items` → Matches #2 (AllItemsView)
- URL `/items/abc123` → Matches #5 (ItemDetailView with itemId param)
- URL `/items/new` → Matches #5 (itemId = "new", likely shows not found)
- URL `/invalid` → Matches #7 (NotFoundView)

